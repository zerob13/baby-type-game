name: CI and Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check repository and build when available
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      app: ${{ steps.app.outputs.present }}
    steps:
      - name: Check out full publishable history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test and run repository checks
        run: |
          python3 scripts/check_repository.py --self-test
          python3 scripts/check_repository.py

      - name: Detect application scaffold
        id: app
        shell: bash
        run: |
          if [[ ! -f package.json && ! -f package-lock.json && ! -f index.html ]]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Documentation stage: repository checks run; game build and deployment are skipped.' >> "$GITHUB_STEP_SUMMARY"
          else
            for file in package.json package-lock.json index.html; do
              if [[ ! -f "$file" ]]; then
                echo "::error::Incomplete application scaffold: $file is required."
                exit 1
              fi
            done
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install, validate, test, and build
        if: steps.app.outputs.present == 'true'
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          python3 scripts/check_repository.py --dist

      - name: Upload verified static output
        if: steps.app.outputs.present == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pages-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publish to Cloudflare Pages
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check Cloudflare configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo '::error::Set the CLOUDFLARE_ACCOUNT_ID repository secret to your 32-character Cloudflare account ID.'
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret with Account / Cloudflare Pages / Edit permission.'
            exit 1
          fi

      - name: Set up deployment runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned deployment CLI
        run: npm install --global wrangler@4.151.1

      - name: Download verified build
        if: needs.check.outputs.app == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pages-dist
          path: dist

      - name: Deploy the verified build
        if: needs.check.outputs.app == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          wrangler pages deploy dist
          --project-name=baby-type-game
          --branch=main
          --commit-hash=${{ github.sha }}

